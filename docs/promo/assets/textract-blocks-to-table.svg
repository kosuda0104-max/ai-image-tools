<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" role="img" aria-labelledby="title desc">
  <title id="title">Rebuilding a table from Textract Block relationships</title>
  <desc id="desc">Textract returns a flat list of Block objects joined by CHILD relationships. Walking TABLE to CELL to WORD and ordering by row and column index rebuilds the table a human saw in the document.</desc>
  <rect width="1520" height="700" fill="#f8fafc"/>
  <rect x="2" y="2" width="1516" height="696" rx="28" fill="none" stroke="#dbe3ee" stroke-width="4"/>

  <text x="760" y="72" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="38" font-weight="700" fill="#10213d">The structure is a graph, not a table</text>
  <text x="760" y="112" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22" fill="#60708a">Textract never returns "the table on page 2". It returns Blocks and the edges between them.</text>

  <!-- Left: block graph -->
  <rect x="60" y="160" width="640" height="480" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="60" y="160" width="640" height="66" rx="18" fill="#fdf1e3"/>
  <path d="M60 226h640" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="203" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="26" font-weight="700" fill="#8a5a00">Block[] with Relationships</text>

  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <rect x="110" y="262" width="200" height="58" rx="12" fill="#f4f8fd" stroke="#9fb0c6" stroke-width="3"/>
    <text x="210" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#10213d">PAGE</text>

    <rect x="190" y="356" width="200" height="58" rx="12" fill="#f4f8fd" stroke="#9fb0c6" stroke-width="3"/>
    <text x="290" y="392" text-anchor="middle" font-size="22" font-weight="700" fill="#10213d">TABLE</text>

    <rect x="270" y="450" width="290" height="58" rx="12" fill="#f4f8fd" stroke="#9fb0c6" stroke-width="3"/>
    <text x="415" y="486" text-anchor="middle" font-size="21" font-weight="700" fill="#10213d">CELL row=1 col=1</text>

    <rect x="350" y="544" width="270" height="58" rx="12" fill="#f4f8fd" stroke="#9fb0c6" stroke-width="3"/>
    <text x="485" y="580" text-anchor="middle" font-size="21" font-weight="700" fill="#10213d">WORD "Invoice"</text>
  </g>

  <g stroke="#c2410c" stroke-width="3" fill="none">
    <path d="M150 320v52h34"/>
    <path d="M230 414v50h34"/>
    <path d="M310 508v50h34"/>
  </g>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="700" fill="#c2410c">
    <text x="196" y="356">CHILD</text>
    <text x="276" y="450">CHILD</text>
    <text x="356" y="544">CHILD</text>
  </g>

  <!-- Arrow -->
  <path d="M720 400h100" stroke="#9fb0c6" stroke-width="6" fill="none"/>
  <path d="M820 400l-18-12v24z" fill="#9fb0c6"/>
  <text x="770" y="374" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="19" font-weight="700" fill="#60708a">walk + order</text>

  <!-- Right: rebuilt table -->
  <rect x="840" y="160" width="620" height="480" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="840" y="160" width="620" height="66" rx="18" fill="#e8f8f1"/>
  <path d="M840 226h620" stroke="#cbd5e1" stroke-width="2"/>
  <text x="874" y="203" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="26" font-weight="700" fill="#047857">Excel / CSV</text>

  <g font-family="Arial, 'Noto Sans JP', sans-serif" font-size="21">
    <rect x="884" y="266" width="176" height="60" fill="#eefaf3" stroke="#6fcf97" stroke-width="2"/>
    <rect x="1060" y="266" width="176" height="60" fill="#eefaf3" stroke="#6fcf97" stroke-width="2"/>
    <rect x="1236" y="266" width="176" height="60" fill="#eefaf3" stroke="#6fcf97" stroke-width="2"/>
    <text x="972" y="304" text-anchor="middle" font-weight="700" fill="#10213d">Invoice</text>
    <text x="1148" y="304" text-anchor="middle" font-weight="700" fill="#10213d">Qty</text>
    <text x="1324" y="304" text-anchor="middle" font-weight="700" fill="#10213d">Amount</text>

    <rect x="884" y="326" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1060" y="326" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1236" y="326" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="972" y="363" text-anchor="middle" fill="#10213d">A-1042</text>
    <text x="1148" y="363" text-anchor="middle" fill="#10213d">3</text>
    <text x="1324" y="363" text-anchor="middle" fill="#10213d">12,000</text>

    <rect x="884" y="384" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1060" y="384" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1236" y="384" width="176" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="972" y="421" text-anchor="middle" fill="#10213d">A-1043</text>
    <text x="1148" y="421" text-anchor="middle" fill="#10213d">1</text>
    <text x="1324" y="421" text-anchor="middle" fill="#10213d">4,500</text>
  </g>

  <rect x="884" y="470" width="528" height="132" rx="14" fill="#fef6f3" stroke="#f0a68c" stroke-width="3"/>
  <text x="912" y="508" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="21" font-weight="700" fill="#b4462a">Check the result against the source</text>
  <text x="912" y="544" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="19" fill="#7d4636">Reconstruction is not perfect on merged cells</text>
  <text x="912" y="576" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="19" fill="#7d4636">or on tables that span several pages.</text>
</svg>

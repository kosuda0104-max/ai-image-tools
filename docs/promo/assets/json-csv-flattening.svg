<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" role="img" aria-labelledby="title desc">
  <title id="title">JSONの入れ子をCSVの列へ変換する流れ</title>
  <desc id="desc">JSONのオブジェクトをドット記法へ、配列を1つのセルへ変換する図</desc>
  <rect width="1520" height="700" fill="#f8fafc"/>
  <rect x="2" y="2" width="1516" height="696" rx="28" fill="none" stroke="#dbe3ee" stroke-width="4"/>

  <text x="760" y="76" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="38" font-weight="700" fill="#10213d">JSONの入れ子をCSVの列へ</text>
  <text x="760" y="116" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22" fill="#60708a">表にする前に、オブジェクトと配列の扱いを決める</text>

  <rect x="70" y="165" width="510" height="400" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="70" y="165" width="510" height="66" rx="18" fill="#e8f8f1"/>
  <path d="M70 213h510" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#047857">JSON</text>
  <g font-family="Consolas, 'Noto Sans Mono', monospace" font-size="24" fill="#10213d">
    <text x="112" y="278">{</text>
    <text x="145" y="320">"id": 1,</text>
    <text x="145" y="362">"name": "佐藤",</text>
    <text x="145" y="404">"addr": { "city": "東京" },</text>
    <text x="145" y="446">"tags": ["a", "b"]</text>
    <text x="112" y="488">}</text>
  </g>

  <path d="M625 350h190" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 330l34 20-34 20" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="638" y="270" width="164" height="54" rx="27" fill="#fff4e8" stroke="#fb923c" stroke-width="2"/>
  <text x="720" y="306" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22" font-weight="700" fill="#c2410c">フラット化</text>

  <rect x="880" y="165" width="570" height="400" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="880" y="165" width="570" height="66" rx="18" fill="#fff4e8"/>
  <path d="M880 213h570" stroke="#cbd5e1" stroke-width="2"/>
  <text x="915" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#c2410c">CSV</text>

  <rect x="925" y="275" width="480" height="142" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="925" y="275" width="480" height="64" fill="#eef2ff"/>
  <path d="M1025 275v142M1240 275v142M925 339h480" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22" fill="#10213d">
    <text x="975" y="316" text-anchor="middle" font-weight="700">id</text>
    <text x="1132" y="316" text-anchor="middle" font-weight="700">addr.city</text>
    <text x="1322" y="316" text-anchor="middle" font-weight="700">tags</text>
    <text x="975" y="384" text-anchor="middle">1</text>
    <text x="1132" y="384" text-anchor="middle">東京</text>
    <text x="1322" y="384" text-anchor="middle">a,b</text>
  </g>

  <rect x="150" y="605" width="1220" height="58" rx="12" fill="#10213d"/>
  <text x="760" y="643" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="24" font-weight="700" fill="#ffffff">オブジェクト → ドット記法の列　　配列 → 1セルへ結合</text>
</svg>

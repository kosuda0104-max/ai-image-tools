name: GSC Index Audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gsc-index-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit pending URLs
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://ai-image-tools.com/' }}
          GSC_INDEX_AUDIT_APPLY: '1'
        run: node scripts/gsc-index-audit.mjs
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/seo-reports/ docs/index-request-secretary.md
          git diff --staged --quiet || git commit -m "chore: GSC index audit $(date -u +%Y-%m-%d)"
          git push
